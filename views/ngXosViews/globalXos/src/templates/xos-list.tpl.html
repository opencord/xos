<div class="container">
  <div class="row">
    <h2>Select XOS to synch:</h2>
  </div>
  <div class="row">
      <div
          ng-repeat="xos in vm.xoss"
          class="col-sm-2">
          <div 
            class="well" 
            ng-class="{active: xos.active}"
            ng-click="vm.toggleXos(xos)">
              {{xos.humanReadableName || xos.name}}
          </div>
      </div>
  </div>
  <div class="row" ng-if="vm.localSlices.length > 0">
    <div class="col-xs-12">
      <h2>L-XOS Slices:</h2>
    </div>
    <div class="col-xs-12">
      <xos-table
        config="vm.sliceTableCfg"
        data="vm.localSlices">
      </xos-table>
    </div>
  </div>
  <div class="row" ng-if="vm.localSlices.length > 0">
    <div class="col-xs-12">
      <h2>L-XOS Users:</h2>
    </div>
    <div class="col-xs-12">
      <xos-table
        config="vm.usersTableCfg"
        data="vm.localUsers">
      </xos-table>
    </div>
  </div>
</div>
