definitions:
    MetroNetworkSystem:
      type: "object"
      properties:
        name:
          type: string
        description:
          type: string
        restUrl:
          type: string
        administrativeState:
          type: string
          enum:
            - enabled
            - disabled
        operationalState:
          type: string
          enum:
            - active
            - inactive

    NetworkDevice:
      type: "object"
      properties:
        name:
          type: string
          description: "Device friendly name"

        restCtrlUrl:
          type: string
        authType:
          type: string
          enum:
            - basic
            - key
            - oauth
        username:
          type: string
        password:
          type: string
        administrativeState:
          type: string
          enum:
            - enabled
            - disabled
            - syncrequested
            - syncinprogress

    NetworkEdgePort:
      type: "object"
      properties:
        element:
          type: integer
        pid:
          type: string
        bwpCfgCbs:
          type: integer
        bwpCfgEbs:
          type: integer
        bwpCfgCir:
          type: integer
        bwpCfgEir:
          type: integer
        name:
          type: string
        location:
          type: string
        latlng:
          type: string

    NetworkEdgeToEdgePointConnection:
      type: "object"
      properties:
        sid:
          type: string
        type:
          type: string
          enum:
            - direct
            - tunnel
            - optical
            - virtual
            - Point_To_Point
        vlanid:
          type: string
        uni1:
          type: integer
        uni2:
          type: integer
        operstate:
          type: string
          enum:
            - active
            - inactive
        adminstate:
          type: string
          enum:
            - disabled
            - activationrequested
            - enabled
            - invalid
            - deactivationrequested

    NetworkEdgeToMultipointConnection:
      type: "object"
      properties:
        sid:
          type: string
        type:
          type: string
          enum:
            - vlan
            - ip
            - ethernet
            - Root_Multipoint
        vlanid:
          type: string
        root:
          type: integer
        operstate:
          type: string
          enum:
            - active
            - inactive
        adminstate:
          type: string
          enum:
            - disabled
            - activationrequested
            - enabled
            - invalid
            - deactivationrequested
        eps:
          type: integer

    NetworkMultipointToMultipointConnection:
      type: "object"
      properties:
        sid:
          type: string
        type:
          type: string
          enum:
            - vlan
            - ip
            - ethernet
            - Multipoint_To_Multipoint
        vlanid:
          type: string
        operstate:
          type: string
          enum:
            - active
            - inactive
        adminstate:
          type: string
          enum:
            - disabled
            - activationrequested
            - enabled
            - invalid
            - deactivationrequested
        eps:
          type: integer

