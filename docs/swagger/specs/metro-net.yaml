          type: integer
        bwpcfgebs:
          type: integer
        bwpcfgcir:
          type: integer
        bwpcfgeir:
          type: integer
        name:
          type: string

    RemotePort:
      type: "object"
      properties:
        remoteportsite:
          type: integer
        edgeport:
          type: integer
        name:
          type: string

    ServiceSpoke:
