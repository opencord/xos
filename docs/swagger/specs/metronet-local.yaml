definitions:
    VnodLocalSystem:
      type: "object"
      properties:
        name:
          type: string
        description:
          type: string
        restUrl:
          type: string
        username:
          type: string
        password:
          type: string
        administrativeState:
          type: string
          enum:
            - enabled
            - disabled
        pseudowireprovider:
          type: string
        networkControllerUrl:
          type: string

    VnodLocalService:
      type: "object"
      properties:
        portid:
          type: string
        vlanid:
          type: string
        servicehandle:
          type: string
        autoattached:
          type: boolean
        administrativeState:
          type: string
          enum:
            - disabled
            - configurationrequested
            - configurationfailed
            - configured
            - activationrequested
            - activationfailed
            - enabled
            - deactivationrequested
        operstate:
          type: string
          enum:
            - active
            - inactivereported
            - inactive
            - activereported

    VnodLocalPseudowireConnectorService:
      type: "object"
      properties:
        servicehandle:
          type: string
        pseudowirehandle:
          type: string
        internalport:
          type: string
        vnodlocal:
          type: integer
        administrativeState:
          type: string
          enum:
            - disabled
            - activationrequested
            - enabled
            - deactivationrequested
        operstate:
          type: string
          enum:
            - active
            - inactive
