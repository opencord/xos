definitions:
    VRouterService:
      type: "object"
      properties:
        rest_hostname:
          type: string
        rest_port:
          type: integer
        rest_user:
          type: string
        rest_pass:
          type: string

    VRouterDevice:
      type: "object"
      properties:
        name:
          type: string
          description: "device friendly name"

        openflow_id:
          type: string
          description: "device identifier in ONOS"

        config_key:
          type: string
          description: "configuration key"

        driver:
          type: string
          description: "driver type"

        vrouter_service:
          type: integer

    VRouterPort:
      type: "object"
      properties:
        name:
          type: string
          description: "port friendly name"

        openflow_id:
          type: string
          description: "port identifier in ONOS"

        vrouter_device:
          type: integer
        vrouter_service:
          type: integer

    VRouterApp:
      type: "object"
      properties:
        vrouter_service:
          type: integer
        name:
          type: string
          description: "application name"

        control_plane_connect_point:
          type: string
          description: "port identifier in ONOS"

        ospf_enabled:
          type: boolean
          description: "ospf enabled"


    VRouterInterface:
      type: "object"
      properties:
        vrouter_port:
          type: integer
        name:
          type: string
          description: "interface name"

        mac:
          type: string
          description: "interface mac"

        vlan:
          type: string
          description: "interface vlan id"


    VRouterIp:
      type: "object"
      properties:
        name:
          type: string
          description: "ip friendly name"

        vrouter_interface:
          type: integer
        ip:
          type: string
          description: "interface ips"


    VRouterTenant:
      type: "object"
      properties:
        public_ip:
          type: string
        public_mac:
          type: string
        address_pool:
          type: integer
