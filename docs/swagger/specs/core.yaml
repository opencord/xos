definitions:
    XOSBase:
      type: "object"
      properties:
        created:
          type: string
        updated:
          type: string
        enacted:
          type: string
        policed:
          type: string
        backend_register:
          type: string
        backend_need_delete:
          type: boolean
        backend_need_reap:
          type: boolean
        backend_status:
          type: string
        backend_code:
          type: integer
        deleted:
          type: boolean
        write_protect:
          type: boolean
        lazy_blocked:
          type: boolean
        no_sync:
          type: boolean
        no_policy:
          type: boolean
        policy_status:
          type: string
        policy_code:
          type: integer
        leaf_model_name:
          type: string
          description: "The most specialized model in this chain of inheritance, often defined by a service developer"


    User:
      type: "object"
      properties:
        email:
          type: string
        username:
          type: string
        password:
          type: string
        last_login:
          type: string
        firstname:
          type: string
          description: "person's given name"

        lastname:
          type: string
          description: "person's surname"

        phone:
          type: string
          description: "phone number contact"

        user_url:
          type: string
        site:
          type: integer
          description: "Site this user will be homed too"

        public_key:
          type: string
          description: "Public key string"

        is_active:
          type: boolean
        is_admin:
          type: boolean
        is_staff:
          type: boolean
        is_readonly:
          type: boolean
        is_registering:
          type: boolean
        is_appuser:
          type: boolean
        login_page:
          type: string
          description: "send this user to a specific page on login"

        created:
          type: string
        updated:
          type: string
        enacted:
          type: string
        policed:
          type: string
        backend_status:
          type: string
        backend_need_delete:
          type: boolean
        backend_need_reap:
          type: boolean
        deleted:
          type: boolean
        write_protect:
          type: boolean
        lazy_blocked:
          type: boolean
        no_sync:
          type: boolean
        no_policy:
          type: boolean
        timezone:
          type: string
        dashboards:
          type: integer
        policy_status:
          type: string

    Privilege:
      type: "object"
      properties:
        accessor_id:
          type: integer
        accessor_type:
          type: string
        controller_id:
          type: integer
        object_id:
          type: integer
        object_type:
          type: string
        permission:
          type: string
        granted:
          type: string
        expires:
          type: string

    AddressPool:
      type: "object"
      properties:
        name:
          type: string
        addresses:
          type: string
        gateway_ip:
          type: string
        gateway_mac:
          type: string
        cidr:
          type: string
        inuse:
          type: string
        service:
          type: integer

    Controller:
      type: "object"
      properties:
        name:
          type: string
          description: "Name of the Controller"

        backend_type:
          type: string
          description: "Type of compute controller, e.g. EC2, OpenStack, or OpenStack version"

        version:
          type: string
          description: "Controller version"

        auth_url:
          type: string
          description: "Auth url for the compute controller"

        admin_user:
          type: string
          description: "Username of an admin user at this controller"

        admin_password:
          type: string
          description: "Password of theadmin user at this controller"

        admin_tenant:
          type: string
          description: "Name of the tenant the admin user belongs to"

        domain:
          type: string
          description: "Name of the domain this controller belongs to"

        rabbit_host:
          type: string
          description: "IP address of rabbitmq server at this controller"

        rabbit_user:
          type: string
          description: "Username of rabbitmq server at this controller"

        rabbit_password:
          type: string
          description: "Password of rabbitmq server at this controller"

        deployment:
          type: integer

    ControllerDashboardView:
      type: "object"
      properties:
        controller:
          type: integer
        dashboardView:
          type: integer
        enabled:
          type: boolean
