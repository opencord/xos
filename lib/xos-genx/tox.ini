[tox]
envlist = py27
;,py35,py36,py37
skip_missing_interpreters = true

[testenv]
deps =
  nose2
  flake8
  Jinja2
  PyYAML
  colorama
  plyxproto
  mock

;  https://github.com/zdw/plyprotobuf/archive/py3.zip

commands =
  nose2 -c tox.ini --verbose --junit-xml
;  flake8

[flake8]
; F821, ignoring undefined names would be valuable, but our testing dynamically loads them
; ignore = F821
max-line-length = 119

[unittest]
plugins=nose2.plugins.junitxml

[coverage]
always-on = True
coverage = xosgenx
coverage-report =
  xml
  term
