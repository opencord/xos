---
- hosts: localhost

  tasks: 
    - name: build_docker_{{ item.docker_image_name }}
      shell: chdir={{ build_dir }} docker build -f {{ item.item_fn }} --rm -t {{ item.docker_image_name }} .
      with_items: dockerfiles

