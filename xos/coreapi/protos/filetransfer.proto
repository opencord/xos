syntax = "proto3";

package xos;

import "google/protobuf/empty.proto";
import "common.proto";
import "xosoptions.proto";

message FileRequest {
    string uri = 1;
};

message FileContents {
    string chunk = 1;
}

service filetransfer {
    rpc Download(FileRequest) returns (stream FileContents) {};
}
